<div x-show="!isAuthenticated" class="min-h-screen flex items-center justify-center bg-slate-950 p-4 relative overflow-hidden" x-cloak>
  <!-- Background Glow & Animated Orbs -->
  <div class="absolute -top-40 -left-40 w-96 h-96 bg-blue-600/20 rounded-full blur-3xl pointer-events-none"></div>
  <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-cyan-500/20 rounded-full blur-3xl pointer-events-none"></div>
  
  <div class="w-full max-w-md bg-slate-900/90 border border-slate-800/80 backdrop-blur-xl rounded-2xl shadow-2xl p-8 z-10">
    <!-- Header Logo & Branding -->
    <div class="text-center mb-8">
      <div class="w-full max-w-[260px] h-24 mx-auto mb-4 p-2 bg-slate-900/60 rounded-2xl flex items-center justify-center shadow-xl shadow-cyan-500/10 border border-slate-800/80 overflow-hidden">
        <img src="logo.png" 
             onerror="this.src='https://lh3.googleusercontent.com/d/1P-mm5_Wx1z1MJ3eBrglcC0pdJ_gAbVCF'" 
             alt="Fath Indah Logo" 
             class="max-w-full max-h-full object-contain filter drop-shadow">
      </div>
      <h1 class="text-2xl font-bold text-slate-100 tracking-tight">Fath Indah</h1>
      <p class="text-sm text-slate-400 mt-1">Silakan masuk menggunakan akun karyawan Anda</p>
    </div>

    <!-- Alert Error -->
    <div x-show="loginError" class="mb-6 p-3.5 bg-rose-500/10 border border-rose-500/30 rounded-xl flex items-center gap-3 text-rose-400 text-sm" x-transition>
      <i class="fa-solid fa-triangle-exclamation text-lg shrink-0"></i>
      <span x-text="loginError"></span>
    </div>

    <!-- Login Form -->
    <form @submit.prevent="handleLogin()" class="space-y-5">
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">User ID / Username</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
            <i class="fa-solid fa-user"></i>
          </span>
          <input type="text" x-model="loginForm.username" required placeholder="Masukkan User ID / Username" autocomplete="username"
            class="w-full pl-10 pr-4 py-3 bg-slate-950/60 border border-slate-700/70 rounded-xl text-slate-100 placeholder-slate-500 focus:outline-none focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 transition-all text-sm">
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Password</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
            <i class="fa-solid fa-lock"></i>
          </span>
          <input :type="showPassword ? 'text' : 'password'" x-model="loginForm.password" required placeholder="••••••••"
            class="w-full pl-10 pr-10 py-3 bg-slate-950/60 border border-slate-700/70 rounded-xl text-slate-100 placeholder-slate-500 focus:outline-none focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 transition-all text-sm">
          <button type="button" @click="showPassword = !showPassword" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-500 hover:text-slate-300">
            <i class="fa-solid" :class="showPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
          </button>
        </div>
      </div>

      <!-- Remember & Submit -->
      <button type="submit" :disabled="loading"
        class="w-full py-3.5 px-4 bg-gradient-to-r from-blue-600 to-cyan-500 hover:from-blue-500 hover:to-cyan-400 text-white font-medium rounded-xl shadow-lg shadow-cyan-500/25 focus:outline-none focus:ring-2 focus:ring-cyan-400 transition-all duration-200 flex items-center justify-center gap-2 text-sm disabled:opacity-50">
        <template x-if="loading">
          <div class="flex items-center gap-2">
            <i class="fa-solid fa-circle-notch fa-spin"></i>
            <span>Memverifikasi...</span>
          </div>
        </template>
        <template x-if="!loading">
          <div class="flex items-center gap-2">
            <span>Masuk ke Dashboard</span>
            <i class="fa-solid fa-arrow-right text-xs"></i>
          </div>
        </template>
      </button>
    </form>


  </div>
</div>
