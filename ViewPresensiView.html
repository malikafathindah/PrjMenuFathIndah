<div x-show="currentModule === 'mod_presensi'"
    class="h-[calc(100vh-140px)] flex flex-col bg-slate-950 rounded-2xl shadow-2xl p-4 md:p-6 border border-slate-800 text-slate-300"
    x-data="viewPresensiManager()">

    <!-- Header -->
    <div
        class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 bg-slate-900 p-4 rounded-xl border border-slate-800 shadow-inner mb-4">
        <div>
            <h2
                class="text-xl md:text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-teal-500 flex items-center gap-3 uppercase tracking-wider">
                <i class="fa-solid fa-map-location-dot text-amber-400"></i> Absensi Kehadiran GPS
            </h2>
            <p class="text-xs text-slate-500 uppercase tracking-widest mt-1">Modul Karyawan / Absensi Lokasi</p>
        </div>
    </div>

    <div class="flex-1 overflow-y-auto grid grid-cols-1 lg:grid-cols-2 gap-6 bg-slate-950">

        <!-- Left Column: Actions -->
        <div class="space-y-6">

            <!-- Datang / Pulang -->
            <div class="bg-slate-900 rounded-xl border border-slate-800 p-5 shadow-lg">
                <h3 class="text-sm font-bold uppercase tracking-wider text-slate-200 mb-1">Absensi Harian</h3>
                <p class="text-xs text-slate-400 mb-4">Pastikan fitur GPS aktif. Tombol akan merekam koordinat lokasi
                    Anda saat ini.</p>

                <div x-show="locationStatus"
                    class="mb-3 text-xs text-emerald-400 animate-pulse font-mono flex items-center gap-2">
                    <i class="fa-solid fa-location-crosshairs fa-spin"></i> <span x-text="locationStatus"></span>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <button @click="getGPSAndSubmit('Datang')" :disabled="isProcessing"
                        class="w-full bg-emerald-600 hover:bg-emerald-500 disabled:opacity-50 text-white font-bold py-3 px-4 rounded-xl shadow-lg shadow-emerald-900/20 transition-all flex items-center justify-center gap-2">
                        <i class="fa-solid fa-right-to-bracket"></i> Absen Datang
                    </button>
                    <button @click="getGPSAndSubmit('Pulang')" :disabled="isProcessing"
                        class="w-full bg-amber-500 hover:bg-amber-400 disabled:opacity-50 text-slate-900 font-bold py-3 px-4 rounded-xl shadow-lg shadow-amber-900/20 transition-all flex items-center justify-center gap-2">
                        <i class="fa-solid fa-right-from-bracket"></i> Absen Pulang
                    </button>
                </div>
            </div>

            <!-- Izin / Tidak Masuk -->
            <div class="bg-slate-900 rounded-xl border border-slate-800 p-5 shadow-lg">
                <h3 class="text-sm font-bold uppercase tracking-wider text-slate-200 mb-4">Laporan Izin / Tidak Masuk
                </h3>

                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Kategori
                            Alasan</label>
                        <select x-model="izinForm.alasan"
                            class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2.5 text-sm text-slate-200 focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 outline-none transition-all">
                            <option value="" disabled>-- Pilih Alasan --</option>
                            <option value="Sakit">Sakit</option>
                            <option value="Cuti">Cuti</option>
                            <option value="Izin">Izin</option>
                            <option value="Perjalanan Dinas">Perjalanan Dinas</option>
                            <option value="Lain-lain">Lain-lain</option>
                        </select>
                    </div>

                    <div x-show="izinForm.alasan === 'Lain-lain' || izinForm.alasan === 'Izin'" x-collapse>
                        <input type="text" x-model="izinForm.alasanKustom" placeholder="Tuliskan alasan spesifik..."
                            class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 text-sm text-slate-200 focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 outline-none transition-all">
                    </div>

                    <button @click="submitIzin()" :disabled="isProcessing"
                        class="w-full bg-slate-700 hover:bg-slate-600 disabled:opacity-50 text-white font-bold py-2.5 px-4 rounded-xl transition-all flex items-center justify-center gap-2 border border-slate-600">
                        <template x-if="isProcessingIzin">
                            <span><i class="fa-solid fa-spinner fa-spin mr-2"></i> Mengirim Laporan...</span>
                        </template>
                        <template x-if="!isProcessingIzin">
                            <span><i class="fa-solid fa-paper-plane"></i> Kirim Laporan</span>
                        </template>
                    </button>
                </div>
            </div>

        </div>

        <!-- Right Column: Riwayat -->
        <div class="bg-slate-900 rounded-xl border border-slate-800 p-5 shadow-lg flex flex-col h-full">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 mb-4">
                <h3 class="text-sm font-bold uppercase tracking-wider text-slate-200">Riwayat Bulan Ini</h3>
                <div class="flex items-center gap-3 w-full sm:w-auto">
                    <!-- Dropdown Karyawan khusus Admin -->
                    <template x-if="userSession.role === 'Admin'">
                        <select x-model="selectedKaryawanId" @change="loadRiwayat()" class="w-full sm:w-48 bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-slate-200 focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 outline-none transition-all uppercase">
                            <option value="">PILIH KARYAWAN...</option>
                            <template x-for="emp in daftarKaryawan" :key="emp.username">
                                <option :value="emp.username" x-text="emp.nama.toUpperCase()"></option>
                            </template>
                        </select>
                    </template>
                    <button @click="loadRiwayat()" class="text-emerald-400 hover:text-emerald-300 transition-colors" title="Refresh">
                        <i class="fa-solid fa-rotate-right" :class="{'fa-spin': isLoadingRiwayat}"></i>
                    </button>
                </div>
            </div>

            <div class="flex-1 overflow-y-auto overflow-x-auto ht-table-scroll pr-2">
                <table class="w-full text-left text-sm whitespace-nowrap">
                    <thead
                        class="bg-slate-800/80 text-slate-400 text-[10px] uppercase font-bold tracking-wider sticky top-0 backdrop-blur">
                        <tr>
                            <th class="px-3 py-2 rounded-tl-lg">Tanggal</th>
                            <th class="px-3 py-2 text-center">Datang</th>
                            <th class="px-3 py-2 text-center">Pulang</th>
                            <th class="px-3 py-2 text-center">Absen</th>
                            <th class="px-3 py-2 text-center">Lokasi GPS</th>
                            <template x-if="userSession.role === 'Admin'">
                                <th class="px-3 py-2 text-center rounded-tr-lg text-red-400"><i class="fa-solid fa-trash-can"></i></th>
                            </template>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-800">
                        <template x-if="isLoadingRiwayat">
                            <tr>
                                <td colspan="5" class="px-3 py-8 text-center text-slate-500 text-xs">
                                    <i class="fa-solid fa-spinner fa-spin mb-2 text-xl text-emerald-500"></i><br>Memuat
                                    data...
                                </td>
                            </tr>
                        </template>
                        <template x-if="!isLoadingRiwayat && groupedRiwayatData.length === 0">
                            <tr>
                                <td colspan="6" class="px-3 py-8 text-center text-slate-500 text-xs">
                                    Belum ada data absensi bulan ini.
                                </td>
                            </tr>
                        </template>
                        <template x-for="(row, idx) in groupedRiwayatData" :key="idx">
                            <tr class="hover:bg-slate-800/50 transition-colors">
                                <td class="px-3 py-2 text-slate-300 font-mono text-xs whitespace-nowrap" x-text="row.tanggal"></td>
                                <td class="px-3 py-2 text-center text-emerald-400 font-mono text-xs" x-text="row.datang"></td>
                                <td class="px-3 py-2 text-center text-amber-400 font-mono text-xs" x-text="row.pulang"></td>
                                <td class="px-3 py-2 text-center">
                                    <template x-if="row.absen !== '-'">
                                        <span class="px-2 py-0.5 rounded text-[10px] uppercase font-bold bg-slate-700 text-slate-300 border border-slate-600 whitespace-nowrap" x-text="row.absen"></span>
                                    </template>
                                    <template x-if="row.absen === '-'">
                                        <span class="text-slate-500 text-xs">-</span>
                                    </template>
                                </td>
                                <td class="px-3 py-2 text-center flex flex-col items-center gap-1">
                                    <template x-if="row.mapsUrlDatang && row.mapsUrlDatang.startsWith('http')">
                                        <a :href="row.mapsUrlDatang" target="_blank"
                                            class="inline-flex items-center gap-1 px-2 py-0.5 bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-400 rounded border border-emerald-500/30 text-[10px] transition-colors w-20 justify-center">
                                            <i class="fa-solid fa-map-pin"></i> Datang
                                        </a>
                                    </template>
                                    <template x-if="row.mapsUrlPulang && row.mapsUrlPulang.startsWith('http')">
                                        <a :href="row.mapsUrlPulang" target="_blank"
                                            class="inline-flex items-center gap-1 px-2 py-0.5 bg-amber-500/10 hover:bg-amber-500/20 text-amber-400 rounded border border-amber-500/30 text-[10px] transition-colors w-20 justify-center">
                                            <i class="fa-solid fa-map-pin"></i> Pulang
                                        </a>
                                    </template>
                                    <template x-if="row.mapsUrlAbsen && row.mapsUrlAbsen.startsWith('http')">
                                        <a :href="row.mapsUrlAbsen" target="_blank"
                                            class="inline-flex items-center gap-1 px-2 py-0.5 bg-slate-500/10 hover:bg-slate-500/20 text-slate-400 rounded border border-slate-500/30 text-[10px] transition-colors w-20 justify-center">
                                            <i class="fa-solid fa-map-pin"></i> Absen
                                        </a>
                                    </template>
                                    <template x-if="!row.mapsUrlDatang && !row.mapsUrlPulang && !row.mapsUrlAbsen">
                                        <span class="text-slate-500 text-xs">-</span>
                                    </template>
                                </td>
                                <template x-if="userSession.role === 'Admin'">
                                    <td class="px-3 py-2 text-center">
                                        <template x-if="row.datang !== '-' || row.pulang !== '-' || row.absen !== '-'">
                                            <button @click="deleteAbsen(row.rawDate)" class="text-red-500 hover:text-red-400 transition-colors" title="Hapus Data">
                                                <i class="fa-solid fa-trash"></i>
                                            </button>
                                        </template>
                                    </td>
                                </template>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
        </div>

    </div>
</div>

<script>
    function viewPresensiManager() {
        return {
            locationStatus: '',
            isProcessing: false,
            isProcessingIzin: false,
            isLoadingRiwayat: false,
            selectedKaryawanId: '',
            daftarKaryawan: [],
            riwayat: [],
            izinForm: {
                alasan: '',
                alasanKustom: ''
            },

            init() {
                // Panggil loadRiwayat saat modul dibuka
                this.$watch('currentModule', (val) => {
                    if (val === 'mod_presensi') {
                        if (!this.selectedKaryawanId && this.userSession.username) {
                            this.selectedKaryawanId = this.userSession.username;
                        }
                        this.loadRiwayat();
                        
                        if (this.userSession.role === 'Admin') {
                            this.loadDaftarKaryawan();
                        }
                    }
                });
                
                // Pantau perubahan pada dropdown
                this.$watch('selectedKaryawanId', (newVal) => {
                    if (this.currentModule === 'mod_presensi' && newVal !== undefined) {
                        this.loadRiwayat();
                    }
                });
            },

            get userSession() {
                return (typeof this.currentUser !== 'undefined' && this.currentUser) ? this.currentUser : { username: '', fullName: '', token: '' };
            },

            get groupedRiwayatData() {
                const grouped = {};
                
                const today = new Date();
                const currentYear = today.getFullYear();
                const currentMonth = today.getMonth();
                const currentDate = today.getDate();
                
                const namaHari = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
                const namaBulan = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];

                // 1. Generate tanggal dari 1 sampai hari ini
                for (let i = 1; i <= currentDate; i++) {
                    const loopDate = new Date(currentYear, currentMonth, i);
                    const hari = namaHari[loopDate.getDay()];
                    const d = String(loopDate.getDate()).padStart(2, '0');
                    const m = namaBulan[loopDate.getMonth()];
                    const y = loopDate.getFullYear();
                    
                    const dateKey = `${hari}, ${d} ${m} ${y}`;
                    const rawDateValue = new Date(loopDate.getFullYear(), loopDate.getMonth(), loopDate.getDate()).getTime();
                    
                    grouped[dateKey] = {
                        tanggal: dateKey,
                        datang: '-',
                        pulang: '-',
                        absen: '-',
                        mapsUrlDatang: null,
                        mapsUrlPulang: null,
                        mapsUrlAbsen: null,
                        rawDate: rawDateValue
                    };
                }

                // 2. Cocokkan dengan data riwayat dari server
                this.riwayat.forEach(row => {
                    let validDateStr = row.waktu.replace(' ', 'T');
                    const date = new Date(validDateStr);
                    if (isNaN(date.getTime())) return;
                    
                    const hari = namaHari[date.getDay()];
                    const d = String(date.getDate()).padStart(2, '0');
                    const m = namaBulan[date.getMonth()];
                    const y = date.getFullYear();
                    
                    const dateKey = `${hari}, ${d} ${m} ${y}`;
                    
                    if (!grouped[dateKey]) {
                        grouped[dateKey] = {
                            tanggal: dateKey,
                            datang: '-',
                            pulang: '-',
                            absen: '-',
                            mapsUrlDatang: null,
                            mapsUrlPulang: null,
                            mapsUrlAbsen: null,
                            rawDate: new Date(date.getFullYear(), date.getMonth(), date.getDate()).getTime()
                        };
                    }
                    
                    const timeStr = String(date.getHours()).padStart(2, '0') + ':' + String(date.getMinutes()).padStart(2, '0') + ':' + String(date.getSeconds()).padStart(2, '0');
                    
                    if (row.tipe === 'Datang') {
                        grouped[dateKey].datang = timeStr;
                        if(row.mapsUrl) grouped[dateKey].mapsUrlDatang = row.mapsUrl;
                    } else if (row.tipe === 'Pulang') {
                        grouped[dateKey].pulang = timeStr;
                        if(row.mapsUrl) grouped[dateKey].mapsUrlPulang = row.mapsUrl;
                    } else {
                        grouped[dateKey].absen = row.tipe;
                        if(row.mapsUrl) grouped[dateKey].mapsUrlAbsen = row.mapsUrl;
                    }
                });
                
                // Urutkan dari tanggal terbaru (hari ini) ke tanggal 1
                return Object.values(grouped).sort((a, b) => b.rawDate - a.rawDate);
            },

            getGPSAndSubmit(tipe) {
                if (!this.userSession.username) {
                    Swal.fire({ title: 'Gagal', text: 'Sesi pengguna tidak ditemukan. Silakan muat ulang halaman.', icon: 'error', background: '#0f172a', color: '#f87171' });
                    return;
                }

                this.locationStatus = 'Mengambil lokasi GPS...';
                this.isProcessing = true;

                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(
                        (position) => {
                            const lat = position.coords.latitude;
                            const lng = position.coords.longitude;
                            this.locationStatus = 'Mencatat absensi...';
                            this.sendAbsenData(tipe, lat, lng);
                        },
                        (error) => {
                            this.locationStatus = '';
                            let msg = "Gagal mengambil lokasi GPS.";
                            switch (error.code) {
                                case error.PERMISSION_DENIED:
                                    msg += " Izin Akses Lokasi ditolak.";
                                    break;
                                case error.POSITION_UNAVAILABLE:
                                    msg += " Informasi lokasi tidak tersedia.";
                                    break;
                                case error.TIMEOUT:
                                    msg += " Waktu pengambilan lokasi habis.";
                                    break;
                            }
                            Swal.fire({ title: 'Peringatan GPS', text: msg + " Pastikan GPS aktif dan izin diberikan pada browser Anda.", icon: 'warning', background: '#0f172a', color: '#fbbf24' });
                            this.isProcessing = false;
                        },
                        { enableHighAccuracy: true, timeout: 15000 }
                    );
                } else {
                    Swal.fire({ title: 'Tidak Mendukung', text: 'Browser Anda tidak mendukung fitur lokasi GPS.', icon: 'error', background: '#0f172a', color: '#f87171' });
                    this.isProcessing = false;
                }
            },

            sendAbsenData(tipe, lat, lng) {
                google.script.run
                    .withSuccessHandler(res => {
                        this.isProcessing = false;
                        this.locationStatus = '';
                        Swal.fire({ title: 'Berhasil', text: res.message, icon: 'success', background: '#0f172a', color: '#34d399', timer: 2000, showConfirmButton: false });
                        this.loadRiwayat();
                    })
                    .withFailureHandler(err => {
                        this.isProcessing = false;
                        this.locationStatus = '';
                        Swal.fire({ title: 'Error', text: err.message || 'Gagal menyimpan absensi', icon: 'error', background: '#0f172a', color: '#f87171' });
                    })
                    .apiRecordAbsen(this.userSession.token, this.userSession.username, (this.userSession.fullName || this.userSession.username).toUpperCase(), tipe, lat, lng);
            },

            submitIzin() {
                if (!this.userSession.username) return;
                if (!this.izinForm.alasan) {
                    Swal.fire({ title: 'Perhatian', text: 'Pilih alasan terlebih dahulu!', icon: 'warning', background: '#0f172a', color: '#fbbf24' });
                    return;
                }

                let finalAlasan = this.izinForm.alasan;
                if (finalAlasan === 'Lain-lain' || finalAlasan === 'Izin') {
                    const kustom = this.izinForm.alasanKustom.trim();
                    if (!kustom) {
                        Swal.fire({ title: 'Perhatian', text: 'Tuliskan alasan spesifik Anda pada kolom yang tersedia!', icon: 'warning', background: '#0f172a', color: '#fbbf24' });
                        return;
                    }
                    finalAlasan = finalAlasan + ': ' + kustom;
                }

                this.isProcessing = true;
                this.isProcessingIzin = true;

                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(
                        (position) => {
                            this.kirimDataIzin(finalAlasan, position.coords.latitude, position.coords.longitude);
                        },
                        (error) => {
                            console.warn("GPS tidak aktif atau ditolak, mengirim laporan tanpa koordinat.");
                            this.kirimDataIzin(finalAlasan, "Tidak terdeteksi", "Tidak terdeteksi");
                        },
                        { enableHighAccuracy: true, timeout: 10000 }
                    );
                } else {
                    this.kirimDataIzin(finalAlasan, "Tidak terdeteksi", "Tidak terdeteksi");
                }
            },

            kirimDataIzin(alasan, lat, lng) {
                google.script.run
                    .withSuccessHandler(res => {
                        this.isProcessing = false;
                        this.isProcessingIzin = false;
                        Swal.fire({ title: 'Berhasil', text: res.message, icon: 'success', background: '#0f172a', color: '#34d399' });
                        this.izinForm.alasan = '';
                        this.izinForm.alasanKustom = '';
                        this.loadRiwayat();
                    })
                    .withFailureHandler(err => {
                        this.isProcessing = false;
                        this.isProcessingIzin = false;
                        Swal.fire({ title: 'Error', text: err.message || 'Terjadi kesalahan sistem saat mengirim laporan.', icon: 'error', background: '#0f172a', color: '#f87171' });
                    })
                    .apiRecordIzin(this.userSession.token, this.userSession.username, (this.userSession.fullName || this.userSession.username).toUpperCase(), alasan, lat, lng);
            },

            loadRiwayat() {
                const targetUserId = this.selectedKaryawanId || this.userSession.username;
                if (!targetUserId) return;
                this.isLoadingRiwayat = true;

                google.script.run
                    .withSuccessHandler(res => {
                        this.isLoadingRiwayat = false;
                        this.riwayat = res || [];
                    })
                    .withFailureHandler(err => {
                        this.isLoadingRiwayat = false;
                        console.error("Gagal memuat riwayat", err);
                    })
                    .apiGetRiwayat(this.userSession.token, targetUserId);
            },
            
            loadDaftarKaryawan() {
                google.script.run
                    .withSuccessHandler(res => {
                        this.daftarKaryawan = res || [];
                    })
                    .withFailureHandler(err => {
                        console.error("Gagal memuat daftar karyawan", err);
                    })
                    .apiGetAllKaryawan(this.userSession.token);
            },
            
            deleteAbsen(rawDateValue) {
                const targetUserId = this.selectedKaryawanId || this.userSession.username;
                const targetDate = new Date(rawDateValue);
                const d = targetDate.getDate();
                const m = targetDate.getMonth() + 1;
                const y = targetDate.getFullYear();
                
                Swal.fire({
                    title: 'Hapus Data Absen?',
                    text: `Anda yakin ingin menghapus data absen tanggal ${d}/${m}/${y}? Tindakan ini tidak dapat dibatalkan.`,
                    icon: 'warning',
                    showCancelButton: true,
                    confirmButtonColor: '#ef4444',
                    cancelButtonColor: '#334155',
                    confirmButtonText: 'Ya, Hapus!',
                    cancelButtonText: 'Batal',
                    background: '#0f172a', 
                    color: '#f87171'
                }).then((result) => {
                    if (result.isConfirmed) {
                        this.isLoadingRiwayat = true;
                        google.script.run
                            .withSuccessHandler(res => {
                                if(res.success) {
                                    Swal.fire({ title: 'Terhapus!', text: res.message, icon: 'success', background: '#0f172a', color: '#34d399' });
                                } else {
                                    Swal.fire({ title: 'Gagal', text: res.message, icon: 'error', background: '#0f172a', color: '#f87171' });
                                }
                                this.loadRiwayat();
                            })
                            .withFailureHandler(err => {
                                this.isLoadingRiwayat = false;
                                Swal.fire({ title: 'Error', text: 'Terjadi kesalahan sistem saat menghapus.', icon: 'error', background: '#0f172a', color: '#f87171' });
                            })
                            .apiDeleteAbsen(this.userSession.token, targetUserId, d, m, y);
                    }
                });
            },
            
            formatTanggal(isoString) {
                if (!isoString || isoString === '-') return '-';
                
                // Jika isoString memiliki format "yyyy-MM-dd HH:mm:ss" dari backend, ubah ke format ISO yang valid jika diperlukan
                // atau langsung parser dengan Date (javascript browser modern bisa parse yyyy-mm-dd hh:mm:ss)
                let validDateStr = isoString.replace(' ', 'T');
                const date = new Date(validDateStr);
                if (isNaN(date.getTime())) return isoString;
                
                const namaBulan = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
                const d = String(date.getDate()).padStart(2, '0');
                const m = namaBulan[date.getMonth()];
                const y = date.getFullYear();
                const hh = String(date.getHours()).padStart(2, '0');
                const mm = String(date.getMinutes()).padStart(2, '0');
                const ss = String(date.getSeconds()).padStart(2, '0');
                
                return `${d} ${m} ${y} ${hh}:${mm}:${ss}`;
            }
        }
    }
</script>
