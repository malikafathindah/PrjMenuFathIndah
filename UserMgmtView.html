<div x-show="currentModule === 'mod_users_legacy'" class="space-y-6" x-transition>
  <!-- Header Bar -->
  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 bg-slate-900/80 border border-slate-800 rounded-2xl p-5 shadow-md">
    <div>
      <h2 class="text-xl font-bold text-slate-100 flex items-center gap-2">
        <i class="fa-solid fa-users-gear text-cyan-400"></i>
        <span>Manajemen Pengguna</span>
      </h2>
      <p class="text-xs text-slate-400 mt-1">Kelola data akun karyawan, peran (role), dan kredensial login</p>
    </div>
    <div class="flex items-center gap-3">
      <button @click="openUserModal()" class="px-4 py-2.5 bg-gradient-to-r from-blue-600 to-cyan-500 hover:from-blue-500 hover:to-cyan-400 text-white rounded-xl text-xs font-semibold shadow-lg shadow-cyan-500/20 transition-all flex items-center gap-2">
        <i class="fa-solid fa-user-plus text-xs"></i>
        <span>Tambah User Baru</span>
      </button>
    </div>
  </div>

  <!-- Search & Filter Card -->
  <div class="bg-slate-900/80 border border-slate-800 rounded-2xl p-4 flex items-center justify-between gap-4">
    <div class="relative flex-1 max-w-md">
      <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
        <i class="fa-solid fa-magnifying-glass text-xs"></i>
      </span>
      <input type="text" x-model="userSearchQuery" placeholder="Cari username atau nama..."
        class="w-full pl-9 pr-4 py-2 bg-slate-950/60 border border-slate-800 rounded-xl text-slate-200 placeholder-slate-500 text-xs focus:outline-none focus:border-cyan-400">
    </div>
    <div class="text-xs text-slate-400">
      Total User: <span class="font-bold text-slate-200" x-text="usersList.length"></span>
    </div>
  </div>

  <!-- Users Data Table -->
  <div class="bg-slate-900/80 border border-slate-800 rounded-2xl overflow-hidden shadow-md">
    <div class="overflow-x-auto">
      <table class="w-full text-left text-xs">
        <thead class="bg-slate-950/80 text-slate-400 uppercase tracking-wider font-semibold border-b border-slate-800">
          <tr>
            <th class="py-3.5 px-4">ID</th>
            <th class="py-3.5 px-4">Username</th>
            <th class="py-3.5 px-4">Nama Lengkap</th>
            <th class="py-3.5 px-4">Role</th>
            <th class="py-3.5 px-4">Status</th>
            <th class="py-3.5 px-4 text-right">Aksi</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-slate-800/60 text-slate-300">
          <template x-for="user in filteredUsers()" :key="user.ID">
            <tr class="hover:bg-slate-800/40 transition-colors">
              <td class="py-3.5 px-4 font-mono text-slate-400" x-text="user.ID"></td>
              <td class="py-3.5 px-4 font-semibold text-slate-100 flex items-center gap-2">
                <div class="w-7 h-7 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center text-[10px] text-cyan-400 font-bold" x-text="user.Username.charAt(0).toUpperCase()"></div>
                <span x-text="user.Username"></span>
              </td>
              <td class="py-3.5 px-4" x-text="user.FullName"></td>
              <td class="py-3.5 px-4">
                <span class="px-2.5 py-1 rounded-full text-[11px] font-medium"
                  :class="{
                    'bg-purple-500/10 text-purple-400 border border-purple-500/20': user.Role === 'Admin',
                    'bg-blue-500/10 text-blue-400 border border-blue-500/20': user.Role === 'Manager',
                    'bg-slate-800 text-slate-300 border border-slate-700': user.Role === 'Staff'
                  }"
                  x-text="user.Role"></span>
              </td>
              <td class="py-3.5 px-4">
                <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[11px] font-medium"
                  :class="user.Status === 'Active' ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : 'bg-rose-500/10 text-rose-400 border border-rose-500/20'">
                  <span class="w-1.5 h-1.5 rounded-full" :class="user.Status === 'Active' ? 'bg-emerald-400' : 'bg-rose-400'"></span>
                  <span x-text="user.Status === 'Active' ? 'Aktif' : 'Inaktif'"></span>
                </span>
              </td>
              <td class="py-3.5 px-4 text-right space-x-1">
                <button @click="editUser(user)" class="p-1.5 text-cyan-400 hover:bg-slate-800 rounded-lg transition-colors" title="Edit User">
                  <i class="fa-solid fa-pen-to-square"></i>
                </button>
                <button @click="deleteUser(user.ID)" class="p-1.5 text-rose-400 hover:bg-slate-800 rounded-lg transition-colors" title="Hapus User">
                  <i class="fa-solid fa-trash-can"></i>
                </button>
              </td>
            </tr>
          </template>
        </tbody>
      </table>
    </div>
  </div>

  <!-- User Modal Form (Add / Edit) -->
  <div x-show="userModalOpen" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm" x-cloak>
    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl space-y-5" @click.away="userModalOpen = false">
      <div class="flex items-center justify-between border-b border-slate-800 pb-4">
        <h3 class="text-base font-bold text-slate-100" x-text="userForm.ID ? 'Edit User' : 'Tambah User Baru'"></h3>
        <button @click="userModalOpen = false" class="text-slate-500 hover:text-slate-300">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>

      <form @submit.prevent="saveUser()" class="space-y-4 text-xs">
        <div>
          <label class="block text-slate-400 font-semibold mb-1">Username</label>
          <input type="text" x-model="userForm.Username" :disabled="!!userForm.ID" required placeholder="misal: miftah"
            class="w-full px-3 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-slate-200 placeholder-slate-600 focus:outline-none focus:border-cyan-400 disabled:opacity-50">
        </div>

        <div>
          <label class="block text-slate-400 font-semibold mb-1">Nama Lengkap</label>
          <input type="text" x-model="userForm.FullName" required placeholder="misal: Miftah Faridl"
            class="w-full px-3 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-slate-200 placeholder-slate-600 focus:outline-none focus:border-cyan-400">
        </div>

        <div>
          <label class="block text-slate-400 font-semibold mb-1">Password <span x-show="userForm.ID" class="text-slate-500 font-normal">(Kosongkan jika tak diubah)</span></label>
          <input type="password" x-model="userForm.Password" :required="!userForm.ID" placeholder="••••••••"
            class="w-full px-3 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-slate-200 placeholder-slate-600 focus:outline-none focus:border-cyan-400">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-slate-400 font-semibold mb-1">Role / Hak Akses</label>
            <select x-model="userForm.Role" class="w-full px-3 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-slate-200 focus:outline-none focus:border-cyan-400">
              <option value="Admin">Admin</option>
              <option value="Manager">Manager</option>
              <option value="Staff">Staff</option>
            </select>
          </div>
          <div>
            <label class="block text-slate-400 font-semibold mb-1">Status Akun</label>
            <select x-model="userForm.Status" class="w-full px-3 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-slate-200 focus:outline-none focus:border-cyan-400">
              <option value="Active">Active</option>
              <option value="Inactive">Inactive</option>
            </select>
          </div>
        </div>

        <div class="pt-4 border-t border-slate-800 flex justify-end gap-2">
          <button type="button" @click="userModalOpen = false" class="px-4 py-2 bg-slate-800 text-slate-300 rounded-xl hover:bg-slate-700 transition-colors">Batal</button>
          <button type="submit" class="px-4 py-2 bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold rounded-xl transition-colors">Simpan Data</button>
        </div>
      </form>
    </div>
  </div>
</div>
