<!-- ============================================================================ -->
<!-- ATTENDANCE SUMMARY VIEW COMPONENT (AttendanceView.html) -->
<!-- ============================================================================ -->
<div x-show="isAttendanceSummaryModule(currentModule, currentModuleName)" class="space-y-3 w-full" x-transition>
  
  <!-- Control Toolbar (Search, Refresh, & Legend Status - Compact 1-Screen) -->
  <div class="bg-slate-900/80 border border-slate-800 px-3 py-2 rounded-xl flex flex-col sm:flex-row items-center justify-between gap-2.5 shadow-lg shrink-0">
    
    <div class="flex items-center gap-2 w-full sm:w-auto">
      <!-- Search Input Nama / Lokasi -->
      <div class="relative w-full sm:w-72">
        <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-cyan-400">
          <i class="fa-solid fa-magnifying-glass text-xs"></i>
        </span>
        <input type="text" x-model.debounce.250ms="attendanceSearch" placeholder="Cari Nama atau Lokasi..."
          class="w-full pl-8 pr-3 py-1.5 bg-slate-950/80 border border-slate-700/80 rounded-lg text-xs text-slate-100 placeholder-slate-500 focus:outline-none focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400/30 transition-all shadow-inner">
      </div>

      <!-- Tombol Refresh Data -->
      <button @click="loadAttendanceData(true)" :disabled="loading"
        class="px-3 py-1.5 bg-cyan-500/10 hover:bg-cyan-500/20 text-cyan-300 border border-cyan-500/30 font-bold rounded-lg text-xs transition-all shrink-0 active:scale-95 disabled:opacity-50 flex items-center gap-1.5 shadow-sm"
        title="Refresh Data Absensi">
        <i class="fa-solid fa-rotate text-cyan-400" :class="{ 'fa-spin': loading }"></i>
        <span class="hidden sm:inline">Refresh</span>
      </button>
    </div>
    
    <!-- Legend Status Absensi Compact 3D Outline Glow (H, S, I, A, P = Dinas Pink, C = Cuti Putih) -->
    <div class="flex items-center gap-1.5 flex-wrap text-[10px] font-semibold text-slate-300">
      <span class="px-2 py-0.5 rounded-lg bg-emerald-500/20 text-emerald-300 border border-emerald-400 shadow-[0_0_8px_rgba(52,211,153,0.3)] font-bold flex items-center gap-1">
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span> H = Hadir
      </span>
      <span class="px-2 py-0.5 rounded-lg bg-amber-500/20 text-amber-300 border border-amber-400 shadow-[0_0_8px_rgba(251,191,36,0.3)] font-bold flex items-center gap-1">
        <span class="w-1.5 h-1.5 rounded-full bg-amber-400"></span> S = Sakit
      </span>
      <span class="px-2 py-0.5 rounded-lg bg-cyan-500/20 text-cyan-300 border border-cyan-400 shadow-[0_0_8px_rgba(34,211,238,0.3)] font-bold flex items-center gap-1">
        <span class="w-1.5 h-1.5 rounded-full bg-cyan-400"></span> I = Izin
      </span>
      <span class="px-2 py-0.5 rounded-lg bg-rose-500/20 text-rose-300 border border-rose-400 shadow-[0_0_8px_rgba(251,113,133,0.3)] font-bold flex items-center gap-1">
        <span class="w-1.5 h-1.5 rounded-full bg-rose-400"></span> A = Alpha
      </span>
      <span class="px-2 py-0.5 rounded-lg bg-pink-500/30 text-pink-200 border border-pink-400 shadow-[0_0_10px_rgba(244,114,182,0.4)] font-bold flex items-center gap-1 animate-pulse">
        <span class="w-1.5 h-1.5 rounded-full bg-pink-400"></span> P = Dinas
      </span>
      <span class="px-2 py-0.5 rounded-lg bg-white/20 text-white border border-white shadow-[0_0_8px_rgba(255,255,255,0.3)] font-bold flex items-center gap-1">
        <span class="w-1.5 h-1.5 rounded-full bg-white"></span> C = Cuti
      </span>
      <span class="px-2 py-0.5 rounded-lg bg-[#2e1065] text-[#c084fc] border border-[#c084fc]/80 shadow-[0_0_8px_rgba(192,132,252,0.35)] font-bold flex items-center gap-1">
        <span class="w-1.5 h-1.5 rounded-full bg-[#c084fc]"></span> L = Lain-lain
      </span>
    </div>
  </div>

  <!-- 3D Table Container with Horizontal & Vertical Scroll (OVERFLOW-X-AUTO SCROLL LEFT AND RIGHT) -->
  <div class="bg-slate-900/90 border border-cyan-500/20 rounded-2xl overflow-hidden shadow-[0_20px_50px_-15px_rgba(0,0,0,0.8)] w-full">
    <div class="w-full overflow-x-auto overflow-y-auto flex-1 max-h-[calc(100vh-140px)] scrollbar-thin">
      <table class="w-full min-w-[1320px] text-left text-[10px] border-collapse table-fixed select-none">
        
        <!-- 3D MULTI-ROW MERGED HEADER -->
        <thead class="sticky top-0 z-20 text-slate-200 font-bold uppercase tracking-wider">
          
          <!-- BARIS HEADER 9 (NO CENTER, NAMA KARYAWAN CENTER, LOKASI CENTER) -->
          <tr class="bg-gradient-to-r from-slate-950 via-cyan-950 to-slate-950 text-cyan-300 border-b border-cyan-500/40 text-[10px]">
            <th rowspan="3" class="w-[36px] min-w-[36px] py-2 px-1 text-center border-r border-cyan-500/30 bg-slate-950/95 sticky left-0 z-30 shadow-md">NO</th>
            <th rowspan="3" class="w-[150px] min-w-[150px] py-2 px-2 text-center border-r border-cyan-500/30 bg-slate-950/95 sticky left-[36px] z-30 shadow-md truncate whitespace-nowrap">NAMA KARYAWAN</th>
            <th rowspan="3" class="w-[80px] min-w-[80px] py-2 px-2 text-center border-r border-cyan-500/30 bg-slate-950/95 sticky left-[186px] z-30 shadow-md truncate whitespace-nowrap">LOKASI</th>
            
            <!-- Header Bulan Dinamis Diambil dari Baris 9 Kolom 4 -->
            <th colspan="31" class="py-2 px-2 text-center border-r border-cyan-500/40 bg-gradient-to-r from-cyan-900/60 via-blue-900/60 to-cyan-900/60 text-cyan-200 text-[10px] tracking-widest shadow-md">
              <i class="fa-solid fa-calendar-days text-cyan-400 mr-1"></i>
              <span x-text="((attendanceData && attendanceData.headers && attendanceData.headers.row9 && attendanceData.headers.row9[3]) ? attendanceData.headers.row9[3] : 'BULAN AGUSTUS 2026 (TANGGAL 1 - 30)')"></span>
            </th>
          </tr>

          <!-- BARIS HEADER 10 (Tanggal 1 s/d 31 | Warna Sabtu/Minggu Otomatis) -->
          <tr class="bg-slate-900/90 text-slate-300 border-b border-slate-800 text-[9px] text-center">
            <template x-for="d in 31" :key="'date-'+d">
              <th class="w-[34px] min-w-[34px] py-1 px-0.5 border-r border-slate-800/80"
                :class="isWeekendDay(d) ? 'bg-rose-950/40 text-rose-400 font-bold' : 'bg-slate-900/80 text-cyan-300'"
                x-text="d"></th>
            </template>
          </tr>

          <!-- BARIS HEADER 11 (Singkatan Hari Otomatis) -->
          <tr class="bg-slate-950 text-slate-400 border-b border-cyan-500/30 text-[8px] text-center font-bold">
            <template x-for="d in 31" :key="'day-'+d">
              <th class="w-[34px] min-w-[34px] py-1 px-0.5 border-r border-slate-800/80"
                :class="isWeekendDay(d) ? 'text-rose-400 font-bold' : 'text-slate-500'"
                x-text="getDaySingleLetter(d)"></th>
            </template>
          </tr>
        </thead>

        <!-- DATA ROWS (BARIS TANPA NAMA DIABAIKAN, P = DINAS PINK, C = CUTI PUTIH) -->
        <tbody class="divide-y divide-slate-800/80 text-slate-300 font-medium">
          
          <!-- Loading State -->
          <template x-if="loading">
            <tr>
              <td colspan="34" class="py-12 text-center text-slate-400 bg-slate-950/40">
                <i class="fa-solid fa-circle-notch fa-spin text-2xl text-cyan-400 mb-2"></i>
                <p class="text-xs font-semibold text-slate-300">Memuat data Rekap Absensi 1-Screen...</p>
              </td>
            </tr>
          </template>

          <!-- Empty State -->
          <template x-if="!loading && filteredAttendanceRows().length === 0">
            <tr>
              <td colspan="34" class="py-12 text-center text-slate-500 bg-slate-950/40">
                <i class="fa-solid fa-folder-open text-3xl mb-2 text-slate-600"></i>
                <p class="text-xs font-semibold text-slate-400">Tidak ada data absensi ditemukan atau sheet "Rekap Absensi" masih kosong.</p>
              </td>
            </tr>
          </template>

          <!-- Rendered Data Rows (Baris Tanpa Nilai Nama Diabaikan) -->
          <template x-for="(row, rIdx) in filteredAttendanceRows()" :key="row.rowNum || rIdx">
            <tr class="hover:bg-cyan-950/30 transition-all duration-200 group">
              
              <!-- NO (Col 0 - STICKY LEFT 0) -->
              <td class="w-[36px] min-w-[36px] py-2 px-1 text-center border-r border-slate-800 font-mono text-slate-400 group-hover:text-cyan-400 bg-slate-950/95 sticky left-0 z-10 shadow-md"
                x-text="row.values[0] || (rIdx + 1)"></td>

              <!-- NAMA KARYAWAN (Col 1 - STICKY LEFT 36px) -->
              <td class="w-[150px] min-w-[150px] py-2 px-2 border-r border-slate-800 font-semibold text-slate-100 truncate max-w-[150px] bg-slate-950/95 sticky left-[36px] z-10 shadow-md whitespace-nowrap"
                :title="row.values[1] || ''"
                x-text="row.values[1] || ''"></td>

              <!-- LOKASI (Col 2 - STICKY LEFT 186px) -->
              <td class="w-[80px] min-w-[80px] py-2 px-2 text-center border-r border-slate-800 text-slate-300 truncate max-w-[80px] bg-slate-950/95 sticky left-[186px] z-10 shadow-md whitespace-nowrap"
                :title="row.values[2] || ''"
                x-text="row.values[2] || ''"></td>

              <!-- TANGGAL 1 S/D 31 (Cols 3 s/d 33) -->
              <template x-for="d in 31" :key="'val-'+d">
                <td class="w-[34px] min-w-[34px] py-1 px-0.5 text-center border-r border-slate-800/60 font-mono text-[9px]"
                  :class="{
                    'bg-rose-950/20': isWeekendDay(d)
                  }">
                  
                  <!-- Outlined & Glowing Badge Status Absensi Presisi LampiranGambar (Dark Capsule Fill + Neon Border Outline) -->
                  <span
                    :class="{
                      'inline-flex items-center justify-center w-6 h-5 rounded-md bg-[#04241d] text-[#10b981] border border-[#10b981]/80 font-bold font-mono text-[10px] shadow-[0_0_8px_rgba(16,185,129,0.4)]': (row.values[d + 2] === 'H'),
                      'inline-flex items-center justify-center w-6 h-5 rounded-md bg-[#291b03] text-[#f59e0b] border border-[#f59e0b]/80 font-bold font-mono text-[10px] shadow-[0_0_8px_rgba(245,158,11,0.4)]': (row.values[d + 2] === 'S'),
                      'inline-flex items-center justify-center w-6 h-5 rounded-md bg-[#04222a] text-[#06b6d4] border border-[#06b6d4]/80 font-bold font-mono text-[10px] shadow-[0_0_8px_rgba(6,182,212,0.4)]': (row.values[d + 2] === 'I'),
                      'inline-flex items-center justify-center w-6 h-5 rounded-md bg-[#2a0812] text-[#f43f5e] border border-[#f43f5e]/80 font-bold font-mono text-[10px] shadow-[0_0_8px_rgba(244,63,94,0.4)]': (row.values[d + 2] === 'A'),
                      'inline-flex items-center justify-center w-6 h-5 rounded-md bg-[#2b081e] text-[#ec4899] border border-[#ec4899]/90 font-extrabold font-mono text-[10px] shadow-[0_0_10px_rgba(236,72,153,0.6)] animate-pulse': (row.values[d + 2] === 'P' || row.values[d + 2] === 'Dinas'),
                      'inline-flex items-center justify-center w-6 h-5 rounded-md bg-[#1e293b] text-[#f8fafc] border border-[#f8fafc]/80 font-extrabold font-mono text-[10px] shadow-[0_0_8px_rgba(248,250,252,0.4)]': (row.values[d + 2] === 'C' || row.values[d + 2] === 'Off' || row.values[d + 2] === 'Cuti'),
                      'inline-flex items-center justify-center w-6 h-5 rounded-md bg-[#2e1065] text-[#c084fc] border border-[#c084fc]/80 font-extrabold font-mono text-[10px] shadow-[0_0_8px_rgba(192,132,252,0.4)]': (row.values[d + 2] === 'L' || row.values[d + 2] === 'Lain-lain' || row.values[d + 2] === 'Lainnya'),
                      'text-slate-600': (!row.values[d + 2])
                    }"
                    x-text="(row.values[d + 2] === 'Dinas' ? 'P' : ((row.values[d + 2] === 'Off' || row.values[d + 2] === 'Cuti') ? 'C' : ((row.values[d + 2] === 'Lain-lain' || row.values[d + 2] === 'Lainnya') ? 'L' : (row.values[d + 2] !== undefined && row.values[d + 2] !== null ? row.values[d + 2] : ''))))">
                  </span>
                </td>
              </template>

            </tr>
          </template>
        </tbody>
      </table>
    </div>

    <!-- 3D Table Footer Status Bar -->
    <div class="px-4 py-2 bg-slate-950 border-t border-slate-800/80 text-[11px] text-slate-400 flex flex-col sm:flex-row justify-between items-center gap-2 shrink-0">
      <div class="flex items-center gap-2 flex-wrap text-[10px]">
        <span class="w-2 h-2 rounded-full bg-cyan-400"></span>
        <span>↔ Scroll kiri-kanan untuk melihat tanggal 1 s/d 31 | Columns NO, Nama, Lokasi terkunci (sticky)</span>
      </div>
      <div class="text-slate-300 font-mono text-xs">
        Total Karyawan: <strong class="text-cyan-400" x-text="filteredAttendanceRows().length">0</strong> Orang
      </div>
    </div>
  </div>
</div>
