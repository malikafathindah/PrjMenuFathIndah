<!-- ViewHotelBrochureView.html -->
<div x-show="isViewHotelBrochureModule(currentModule, currentModuleName)" x-init="$watch('currentModule', val => { if(isViewHotelBrochureModule(val)) { loadVBOptions(); searchHotelBrochure(); } })" class="space-y-6 animate-fade-in pb-20" x-transition x-cloak>
  
  <!-- Header -->
  <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-slate-900/80 p-5 rounded-2xl border border-slate-800 shadow-xl relative overflow-hidden">
    <div class="absolute inset-0 bg-gradient-to-r from-cyan-500/10 to-transparent pointer-events-none"></div>
    <div class="relative">
      <h2 class="text-xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-400 flex items-center gap-2">
        <i class="fa-solid fa-book-open text-cyan-400"></i>
        Lihat Brosur Hotel
      </h2>
      <p class="text-xs text-slate-400 mt-1">Cari dan lihat brosur hotel berdasarkan nama, provider, atau rentang periode ketersediaan hotel.</p>
    </div>
  </div>

  <!-- Filter Section -->
  <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl">
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
      
      <!-- Filter: Nama Hotel -->
      <div>
        <label class="block text-slate-300 text-xs font-semibold mb-1.5 flex items-center gap-1.5">
          <i class="fa-solid fa-hotel text-cyan-400"></i> Nama Hotel
        </label>
        <div class="relative">
          <input type="text" x-model="vbSearchForm.namahotel" list="namahotel-list" placeholder="Ketik atau pilih nama hotel..."
            class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-cyan-500">
          <datalist id="namahotel-list">
            <template x-for="opt in vbOptions.hotels" :key="opt">
              <option :value="opt"></option>
            </template>
          </datalist>
          <div class="absolute inset-y-0 right-3 flex items-center pointer-events-none text-slate-500">
            <i class="fa-solid fa-keyboard text-[10px]"></i>
          </div>
        </div>
      </div>

      <!-- Filter: Provider -->
      <div>
        <label class="block text-slate-300 text-xs font-semibold mb-1.5 flex items-center gap-1.5">
          <i class="fa-solid fa-building-user text-purple-400"></i> Provider
        </label>
        <div class="relative">
          <select x-model="vbSearchForm.provider" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-purple-500 appearance-none">
            <option value="">-- Semua Provider --</option>
            <template x-for="opt in vbOptions.providers" :key="opt">
              <option :value="opt" x-text="opt"></option>
            </template>
          </select>
          <div class="absolute inset-y-0 right-3 flex items-center pointer-events-none text-slate-500">
            <i class="fa-solid fa-chevron-down text-[10px]"></i>
          </div>
        </div>
      </div>

      <!-- Filter: Tanggal Mulai -->
      <div>
        <label class="block text-slate-300 text-xs font-semibold mb-1.5 flex items-center gap-1.5">
          <i class="fa-solid fa-calendar text-emerald-400"></i> Tanggal Mulai
        </label>
        <input type="date" x-model="vbSearchForm.startDate" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-emerald-500">
      </div>

      <!-- Filter: Tanggal Akhir -->
      <div>
        <label class="block text-slate-300 text-xs font-semibold mb-1.5 flex items-center gap-1.5">
          <i class="fa-solid fa-calendar-check text-rose-400"></i> Tanggal Akhir
        </label>
        <input type="date" x-model="vbSearchForm.endDate" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-rose-500">
      </div>

    </div>

    <div class="mt-4 flex justify-end gap-3">
      <button @click="resetVBSearch()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl text-xs font-semibold transition-colors flex items-center gap-2">
        <i class="fa-solid fa-eraser"></i> Reset
      </button>
      <button @click="searchHotelBrochure()" class="px-4 py-2 bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white rounded-xl text-xs font-bold shadow-lg shadow-cyan-500/20 transition-all flex items-center gap-2" :disabled="isViewHotelBrochureLoading">
        <i class="fa-solid fa-search" :class="{'fa-spin': isViewHotelBrochureLoading}"></i> Cari Data
      </button>
    </div>
  </div>

  <!-- Search Results (Listing) -->
  <div class="bg-slate-900 border border-slate-800 rounded-2xl shadow-xl overflow-hidden mt-4">
    <div class="p-4 border-b border-slate-800 flex justify-between items-center bg-slate-900/50">
      <h3 class="text-sm font-bold text-slate-200">Daftar Hotel</h3>
      <span x-show="vbDataList.length > 0" class="text-xs text-slate-400 font-semibold" x-text="'Total: ' + vbDataList.length + ' data'"></span>
    </div>
    
    <div class="overflow-x-auto scrollbar-thin">
      <table class="w-full text-left text-xs border-collapse min-w-[800px]">
        <thead class="bg-slate-950 text-cyan-400 font-semibold border-b border-slate-800">
          <tr>
            <th class="py-3 px-4 w-12 text-center border-r border-slate-800">NO</th>
            <th class="py-3 px-4 border-r border-slate-800">NAMA HOTEL</th>
            <th class="py-3 px-4 border-r border-slate-800">KOTA</th>
            <th class="py-3 px-4 border-r border-slate-800">PROVIDER</th>
            <th class="py-3 px-4 border-r border-slate-800 text-center">PERIODE TANGGAL</th>
            <th class="py-3 px-4 border-r border-slate-800 text-center">HARGA BELI</th>
            <th class="py-3 px-4 text-center w-28">AKSI</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-slate-800/50 text-slate-300">
          <template x-for="(item, idx) in vbDataList" :key="idx">
            <tr class="hover:bg-cyan-950/20 transition-colors">
              <td class="py-3 px-4 text-center font-mono text-slate-500 border-r border-slate-800/50" x-text="idx + 1"></td>
              <td class="py-3 px-4 font-bold text-slate-200 border-r border-slate-800/50" x-text="item.namahotel"></td>
              <td class="py-3 px-4 border-r border-slate-800/50">
                <span class="px-2 py-0.5 rounded-md text-[10px] font-bold uppercase tracking-wider" 
                  :class="item.kota === 'Makkah' ? 'bg-amber-500/20 text-amber-300' : (item.kota === 'Madinah' ? 'bg-emerald-500/20 text-emerald-300' : 'bg-slate-800 text-slate-300')"
                  x-text="item.kota || '-'"></span>
              </td>
              <td class="py-3 px-4 border-r border-slate-800/50" x-text="item.provider || '-'"></td>
              <td class="py-3 px-4 font-mono text-[11px] text-emerald-400 text-center border-r border-slate-800/50">
                <span x-text="formatDateDisplay(item.tglawal)"></span> <span class="text-slate-500 mx-1">s/d</span> <br> <span x-text="formatDateDisplay(item.tglakhir)"></span>
              </td>
              <td class="py-2 px-3 border-r border-slate-800/50">
                <div class="flex flex-col gap-1 text-[10px] font-mono whitespace-nowrap min-w-[120px]">
                  <div class="flex justify-between items-center"><span class="text-slate-500 mr-2">DBL:</span><span class="text-amber-400 font-semibold" x-text="item.beli_dbl ? formatCurrencyStr(item.beli_dbl) : '-'"></span></div>
                  <div class="flex justify-between items-center"><span class="text-slate-500 mr-2">TRP:</span><span class="text-amber-400 font-semibold" x-text="item.beli_trpl ? formatCurrencyStr(item.beli_trpl) : '-'"></span></div>
                  <div class="flex justify-between items-center"><span class="text-slate-500 mr-2">QUD:</span><span class="text-amber-400 font-semibold" x-text="item.beli_quad ? formatCurrencyStr(item.beli_quad) : '-'"></span></div>
                </div>
              </td>
              <td class="py-2 px-3 text-center">
                <div class="flex flex-col gap-1.5">
                  <button @click="openVBDetail(item)" class="inline-flex items-center justify-center px-3 py-1.5 bg-blue-500/10 hover:bg-blue-500/20 text-blue-400 border border-blue-500/30 rounded-lg text-[10px] font-bold transition-all w-full">
                    <i class="fa-solid fa-list-ul mr-1.5"></i> Detail
                  </button>
                  <template x-if="item.brochure">
                    <a :href="item.brochure" target="_blank" class="inline-flex items-center justify-center px-3 py-1.5 bg-cyan-500/10 hover:bg-cyan-500/20 text-cyan-400 border border-cyan-500/30 rounded-lg text-[10px] font-bold transition-all w-full">
                      <i class="fa-solid fa-file-image mr-1.5"></i> Brosur
                    </a>
                  </template>
                </div>
              </td>
            </tr>
          </template>
        </tbody>
      </table>

      <!-- Empty State inside Table -->
      <div x-show="vbDataList.length === 0 && !isViewHotelBrochureLoading" class="py-16 text-center border-t border-slate-800">
        <div class="w-12 h-12 bg-slate-800 rounded-full flex items-center justify-center mx-auto mb-3 text-slate-500">
          <i class="fa-solid fa-folder-open text-xl"></i>
        </div>
        <p class="text-slate-400 text-sm font-semibold">Data Tidak Ditemukan</p>
        <p class="text-slate-500 text-xs mt-1">Silakan sesuaikan filter di atas.</p>
      </div>
    </div>
  </div>

  <!-- Modal Detail Informasi Hotel -->
  <div x-show="isVBDetailModalOpen" class="fixed inset-0 z-[100] flex items-center justify-center bg-black/60 backdrop-blur-sm p-4 animate-fade-in" x-transition style="display: none;">
    <div class="bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-3xl max-h-[90vh] flex flex-col shadow-2xl" @click.away="closeVBDetail()">
      
      <!-- Modal Header -->
      <div class="p-5 border-b border-slate-800 flex justify-between items-center bg-slate-900 rounded-t-2xl">
        <h3 class="font-bold text-slate-200 flex items-center gap-2">
          <i class="fa-solid fa-circle-info text-blue-400 text-xl"></i> Informasi Lengkap Hotel
        </h3>
        <button @click="closeVBDetail()" class="text-slate-400 hover:text-white transition-colors">
          <i class="fa-solid fa-xmark text-2xl"></i>
        </button>
      </div>
      
      <!-- Modal Body -->
      <div class="p-6 overflow-y-auto scrollbar-thin">
        <template x-if="selectedHotelDetail">
          <div class="space-y-6">
            
            <!-- Basic Info Header -->
            <div class="flex items-start gap-4 pb-4 border-b border-slate-800/50">
              <div class="w-14 h-14 rounded-xl flex items-center justify-center text-2xl shrink-0"
                :class="selectedHotelDetail.kota === 'Makkah' ? 'bg-amber-500/20 text-amber-400' : (selectedHotelDetail.kota === 'Madinah' ? 'bg-emerald-500/20 text-emerald-400' : 'bg-slate-800 text-slate-400')">
                <i class="fa-solid fa-hotel"></i>
              </div>
              <div class="w-full">
                <div class="flex justify-between items-start">
                  <div>
                    <h2 class="text-lg font-bold text-slate-100" x-text="selectedHotelDetail.namahotel"></h2>
                    <p class="text-sm text-slate-400" x-text="selectedHotelDetail.kota || 'Kota Tidak Diketahui'"></p>
                  </div>
                  <span class="text-xs font-mono text-slate-500 px-2 py-1 bg-slate-800 rounded-lg" x-text="'ID: ' + selectedHotelDetail.idhotel"></span>
                </div>
              </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
              <!-- Left Column -->
              <div class="space-y-4">
                <div>
                  <label class="text-[10px] font-bold text-slate-500 uppercase tracking-wider">Provider</label>
                  <div class="text-sm text-slate-200 font-semibold flex items-center gap-2 mt-1">
                    <i class="fa-solid fa-building-user text-purple-400 w-4"></i>
                    <span x-text="selectedHotelDetail.provider || '-'"></span>
                  </div>
                </div>

                <div>
                  <label class="text-[10px] font-bold text-slate-500 uppercase tracking-wider">Meal Plan</label>
                  <div class="text-sm text-slate-200 font-semibold flex items-center gap-2 mt-1">
                    <i class="fa-solid fa-utensils text-orange-400 w-4"></i>
                    <span x-text="selectedHotelDetail.meal_plan || '-'"></span>
                  </div>
                </div>

                <div>
                  <label class="text-[10px] font-bold text-slate-500 uppercase tracking-wider">Periode Tanggal (Ketersediaan)</label>
                  <div class="text-sm text-emerald-400 font-mono flex items-center gap-2 mt-1 bg-emerald-500/10 p-2.5 rounded-xl border border-emerald-500/20 w-fit">
                    <i class="fa-regular fa-calendar"></i>
                    <span x-text="formatDateDisplay(selectedHotelDetail.tglawal)"></span> 
                    <span class="text-slate-500 mx-1">s/d</span> 
                    <span x-text="formatDateDisplay(selectedHotelDetail.tglakhir)"></span>
                  </div>
                </div>
              </div>

              <!-- Right Column (Prices) -->
              <div class="space-y-4">
                
                <!-- Harga Beli -->
                <div class="bg-slate-950/50 rounded-xl border border-slate-800 p-4">
                  <label class="text-[10px] font-bold text-amber-500 uppercase tracking-wider mb-2 block border-b border-slate-800/80 pb-2">
                    <i class="fa-solid fa-tag mr-1"></i> Harga Beli / Kontrak
                  </label>
                  <div class="grid grid-cols-3 gap-2 mt-2">
                    <div>
                      <div class="text-[10px] text-slate-500 mb-1">Double</div>
                      <div class="text-sm font-mono text-amber-400 font-bold" x-text="selectedHotelDetail.beli_dbl ? formatCurrencyStr(selectedHotelDetail.beli_dbl) : '-'"></div>
                    </div>
                    <div>
                      <div class="text-[10px] text-slate-500 mb-1">Triple</div>
                      <div class="text-sm font-mono text-amber-400 font-bold" x-text="selectedHotelDetail.beli_trpl ? formatCurrencyStr(selectedHotelDetail.beli_trpl) : '-'"></div>
                    </div>
                    <div>
                      <div class="text-[10px] text-slate-500 mb-1">Quad</div>
                      <div class="text-sm font-mono text-amber-400 font-bold" x-text="selectedHotelDetail.beli_quad ? formatCurrencyStr(selectedHotelDetail.beli_quad) : '-'"></div>
                    </div>
                  </div>
                </div>

                <!-- Harga Jual -->
                <div class="bg-slate-950/50 rounded-xl border border-slate-800 p-4">
                  <label class="text-[10px] font-bold text-cyan-500 uppercase tracking-wider mb-2 block border-b border-slate-800/80 pb-2">
                    <i class="fa-solid fa-sack-dollar mr-1"></i> Harga Jual (Estimasi)
                  </label>
                  <div class="grid grid-cols-3 gap-2 mt-2">
                    <div>
                      <div class="text-[10px] text-slate-500 mb-1">Double</div>
                      <div class="text-sm font-mono text-cyan-400 font-bold" x-text="selectedHotelDetail.jual_dbl ? formatCurrencyStr(selectedHotelDetail.jual_dbl) : '-'"></div>
                    </div>
                    <div>
                      <div class="text-[10px] text-slate-500 mb-1">Triple</div>
                      <div class="text-sm font-mono text-cyan-400 font-bold" x-text="selectedHotelDetail.jual_trpl ? formatCurrencyStr(selectedHotelDetail.jual_trpl) : '-'"></div>
                    </div>
                    <div>
                      <div class="text-[10px] text-slate-500 mb-1">Quad</div>
                      <div class="text-sm font-mono text-cyan-400 font-bold" x-text="selectedHotelDetail.jual_quad ? formatCurrencyStr(selectedHotelDetail.jual_quad) : '-'"></div>
                    </div>
                  </div>
                </div>

              </div>
            </div>

            <!-- Brochure Section in Modal -->
            <div class="border-t border-slate-800/50 pt-4 mt-6">
              <template x-if="selectedHotelDetail.brochure">
                <a :href="selectedHotelDetail.brochure" target="_blank" class="w-full flex items-center justify-center gap-2 px-4 py-3 bg-cyan-600 hover:bg-cyan-500 text-white rounded-xl text-sm font-bold shadow-lg shadow-cyan-500/20 transition-all">
                  <i class="fa-solid fa-arrow-up-right-from-square"></i> Buka Lampiran Brosur
                </a>
              </template>
              <template x-if="!selectedHotelDetail.brochure">
                <div class="w-full flex items-center justify-center gap-2 px-4 py-3 bg-slate-800 text-slate-500 rounded-xl text-sm font-bold border border-slate-700">
                  <i class="fa-solid fa-file-circle-xmark"></i> Brosur Tidak Tersedia
                </div>
              </template>
            </div>

          </div>
        </template>
      </div>

      <!-- Modal Footer -->
      <div class="p-4 border-t border-slate-800 flex justify-end bg-slate-900 rounded-b-2xl">
        <button @click="closeVBDetail()" class="px-5 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl text-sm font-bold transition-colors">
          Tutup
        </button>
      </div>
    </div>
  </div>

</div>
