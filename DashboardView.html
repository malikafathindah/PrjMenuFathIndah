<div x-show="currentModule === 'mod_dashboard'" class="space-y-6" x-transition>
  <!-- Welcome Banner with Fath Indah Logo -->
  <div class="relative bg-gradient-to-r from-slate-900 via-blue-950 to-slate-900 border border-slate-800 rounded-2xl p-5 sm:p-6 overflow-hidden shadow-xl">
    <div class="absolute -right-10 -bottom-10 w-64 h-64 bg-cyan-500/10 rounded-full blur-2xl pointer-events-none"></div>
    <div class="flex flex-col md:flex-row items-start md:items-center justify-between gap-5 relative z-10">
      
      <!-- Left Container: Logo Fath Indah + Header Texts -->
      <div class="flex items-center gap-4 sm:gap-5">
        <!-- Fath Indah Logo Box (Dipindahkan ke samping kiri tulisan) -->
        <div class="shrink-0 p-2 sm:p-2.5 rounded-2xl bg-slate-950/80 border border-cyan-500/30 shadow-[0_0_20px_rgba(6,182,212,0.15)] backdrop-blur-md transition-all hover:border-cyan-400/50 hover:shadow-[0_0_30px_rgba(6,182,212,0.25)]">
          <img src="https://lh3.googleusercontent.com/d/1MyvGCEnsnt_GhZBRDycxisWDDKbGfMUV"
               onerror="if (this.src !== 'https://drive.google.com/thumbnail?id=1MyvGCEnsnt_GhZBRDycxisWDDKbGfMUV&sz=w1000') { this.src='https://drive.google.com/thumbnail?id=1MyvGCEnsnt_GhZBRDycxisWDDKbGfMUV&sz=w1000'; } else { this.src='https://drive.google.com/uc?export=view&id=1MyvGCEnsnt_GhZBRDycxisWDDKbGfMUV'; }"
               alt="Logo Fath Indah" 
               class="w-12 h-12 sm:w-16 sm:h-16 md:w-20 md:h-20 object-contain rounded-xl drop-shadow-md" 
               loading="eager" />
        </div>

        <!-- Header Titles & Badge -->
        <div>
          <div class="inline-flex items-center gap-2 px-3 py-1 bg-cyan-500/10 border border-cyan-500/30 text-cyan-400 text-xs font-medium rounded-full mb-2">
            <span class="w-2 h-2 rounded-full bg-cyan-400 animate-pulse"></span>
            <span>HR Analytics & System Portal (Sheet: RekapDashboard)</span>
          </div>
          <h2 class="text-xl sm:text-2xl font-bold text-slate-100">
            <span x-text="getGreeting ? getGreeting() : 'Selamat datang'"></span>, <span x-text="currentUser.fullName || 'User'" class="text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-cyan-400"></span>!
          </h2>
          <p class="text-slate-400 text-xs sm:text-sm mt-1">Dashboard analitik SDM terpadu & ringkasan aktivitas sistem internal.</p>
        </div>
      </div>

      <!-- Right Action Container -->
      <div class="flex items-center gap-3 shrink-0 self-end md:self-center">
        <button @click="loadDashboardStats()" :disabled="isRefreshingDashboard" class="px-4 py-2.5 bg-slate-800/90 hover:bg-slate-700/90 border border-slate-700 text-slate-200 rounded-xl text-xs font-medium transition-all flex items-center gap-2 disabled:opacity-50 shadow-sm">
          <i class="fa-solid fa-rotate text-cyan-400" :class="isRefreshingDashboard ? 'animate-spin' : ''"></i>
          <span x-text="isRefreshingDashboard ? 'Memuat...' : 'Refresh Data'"></span>
        </button>
      </div>
    </div>
  </div>

  <!-- Animated Image Showcase Card (dibawah Logo Fath Indah) -->
  <div class="bg-gradient-to-b from-slate-900/95 via-slate-900/85 to-slate-950/95 border border-cyan-500/30 rounded-3xl p-4 sm:p-7 shadow-[0_0_35px_rgba(6,182,212,0.15)] relative flex flex-col items-center justify-center text-center overflow-hidden group transition-all duration-700 hover:border-cyan-400/50">
    <!-- Animated Glowing Background Orbs -->
    <div class="absolute -top-24 left-1/2 -translate-x-1/2 w-96 h-96 bg-cyan-500/15 rounded-full blur-3xl pointer-events-none animate-pulse-slow"></div>
    <div class="absolute -bottom-24 left-1/2 -translate-x-1/2 w-96 h-96 bg-blue-600/15 rounded-full blur-3xl pointer-events-none animate-pulse-slow"></div>

    <div class="relative z-10 flex flex-col items-center justify-center max-w-4xl mx-auto w-full animate-float-card">
      <div class="p-2.5 sm:p-4 rounded-2xl bg-slate-950/70 border border-slate-800/90 shadow-[0_0_30px_rgba(6,182,212,0.2)] backdrop-blur-md transition-all duration-500 hover:shadow-[0_0_50px_rgba(6,182,212,0.35)] hover:border-cyan-500/50 overflow-hidden">
        <img src="https://lh3.googleusercontent.com/d/1eEPKeXQzeUVAFOtlSAByUMlonNnN36Ak"
             onerror="if (this.src !== 'https://drive.google.com/thumbnail?id=1eEPKeXQzeUVAFOtlSAByUMlonNnN36Ak&sz=w1000') { this.src='https://drive.google.com/thumbnail?id=1eEPKeXQzeUVAFOtlSAByUMlonNnN36Ak&sz=w1000'; } else { this.src='https://drive.google.com/uc?export=view&id=1eEPKeXQzeUVAFOtlSAByUMlonNnN36Ak'; }"
             alt="Gambar Rekap Animated Fath Indah" 
             class="w-full h-auto max-h-[550px] object-contain rounded-xl drop-shadow-[0_15px_30px_rgba(0,0,0,0.6)] animate-slow-pan transform transition-transform duration-700 hover:scale-[1.02]" 
             loading="eager" />
      </div>
    </div>
  </div>


  <!-- Subtle Footer Copyright -->
  <div class="pt-6 text-center">
    <p class="text-[11px] text-slate-500/70 font-mono tracking-wider">
      Copyright &copy; @miftah
    </p>
  </div>
</div>
