<!-- ============================================================================ -->
<!-- MODUL VIEW JAMAAH HAJI (mod_view_jamaah_haji) - BERDASARKAN GROUP             -->
<!-- Tampilan Pengelompokan Data Jamaah Haji yang Rapi, Interaktif & Elegan         -->
<!-- ============================================================================ -->
<div x-show="currentModule === 'mod_view_jamaah_haji'" x-init="loadViewJamaahHajiData()" class="space-y-6" x-transition
  x-cloak>

  <!-- 1. HEADER TOOLBAR DENGAN SELEKTOR GROUP -->
  <div
    class="bg-slate-900/90 border border-slate-800 p-4 sm:p-5 rounded-2xl flex flex-col md:flex-row items-center justify-between gap-4 shadow-xl">
    <!-- Title Info -->
    <div class="flex items-center gap-3.5 w-full md:w-auto">
      <div
        class="w-11 h-11 rounded-2xl bg-amber-500/20 border border-amber-500/30 flex items-center justify-center text-amber-400 shrink-0 shadow-lg shadow-amber-500/5">
        <i class="fa-solid fa-kaaba text-xl"></i>
      </div>
      <div>
        <div class="flex items-center gap-2 flex-wrap">
          <h2 class="text-base font-extrabold text-slate-100 tracking-tight">View Data Jamaah Haji</h2>
          <span
            class="px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-amber-500/10 text-amber-400 border border-amber-500/20 font-mono"
            x-text="'Sheet: ' + (viewJamaahHajiMeta ? viewJamaahHajiMeta.sheetName : 'Auto-Detect')"></span>
          <template x-if="viewJamaahHajiMeta && viewJamaahHajiMeta.spreadsheetName">
            <span
              class="px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-slate-800 text-cyan-300 border border-slate-700 font-mono"
              x-text="viewJamaahHajiMeta.spreadsheetName"></span>
          </template>
        </div>
        <p class="text-xs text-slate-400 mt-0.5 flex items-center gap-1.5">
          <span>Daftar Pengelompokan Jamaah Haji</span>
          <span class="text-slate-600">•</span>
          <span class="text-amber-400/90 font-medium" x-text="'Group: ' + getGroupLabelName()"></span>
        </p>
      </div>
    </div>

    <!-- Toolbar Actions -->
    <div class="flex items-center gap-2.5 w-full md:w-auto justify-end flex-wrap">

      <!-- Grouping Selector Dropdown -->
      <div class="flex items-center gap-2 bg-slate-950/80 border border-slate-800 p-1 rounded-xl text-xs">
        <span class="text-slate-400 pl-2 text-[11px] font-medium flex items-center gap-1">
          <i class="fa-solid fa-layer-group text-amber-400 text-xs"></i>
          <span class="hidden sm:inline">Group By:</span>
        </span>
        <select x-model="viewJamaahHajiGroupBy" @change="activeJamaahHajiGroupTab = 'Semua'"
          class="bg-slate-900 border border-slate-700 text-slate-200 text-xs rounded-lg px-2.5 py-1 focus:outline-none focus:border-amber-400 font-medium">
          <option value="status_bpih">Status BPIH (C = Setoran Awal, F = BPIH Lunas)</option>
          <option value="jenis_haji">Jenis Haji / Kategori</option>
          <option value="bulan">Bulan Pendaftaran</option>
          <option value="bank">Bank Setor Awal</option>
          <option value="mahram">Mahram / Pendamping</option>
          <option value="none">Tanpa Group (Daftar Tunggal)</option>
        </select>
      </div>

      <!-- Total Counter -->
      <div class="px-3 py-1.5 bg-slate-950/80 border border-slate-800 rounded-xl flex items-center gap-2 text-xs">
        <span class="text-slate-400">Total Jamaah:</span>
        <span class="text-amber-400 font-bold font-mono" x-text="getFilteredViewJamaahHajiList().length">0</span>
      </div>

      <!-- Search Input -->
      <div class="relative flex-1 sm:w-48">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 text-xs"></i>
        <input type="text" x-model="viewJamaahHajiSearch" placeholder="Cari Jamaah..."
          class="w-full pl-8 pr-8 py-1.5 bg-slate-950/80 border border-slate-700/80 rounded-xl text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-amber-400">
        <button x-show="viewJamaahHajiSearch" @click="viewJamaahHajiSearch = ''"
          class="absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-300 text-xs">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <!-- Refresh Button -->
      <button @click="loadViewJamaahHajiData(true)"
        class="px-3.5 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-medium border border-slate-700 transition-all flex items-center gap-1.5">
        <i class="fa-solid fa-rotate" :class="{'fa-spin': isViewJamaahHajiLoading}"></i>
        <span class="hidden sm:inline">Refresh</span>
      </button>
    </div>
  </div>

  <!-- 2. TAB SURROUNDING FILTER GROUP & STATUS HAJI FILTER -->
  <template x-if="!isViewJamaahHajiLoading && getFilteredViewJamaahHajiList().length > 0">
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">

      <!-- Grouping Tabs -->
      <div class="flex items-center gap-2 overflow-x-auto pb-1 no-scrollbar text-xs flex-1">
        <template x-if="viewJamaahHajiGroupBy !== 'none'">
          <div class="flex items-center gap-2">
            <button @click="activeJamaahHajiGroupTab = 'Semua'"
              class="px-3.5 py-1.5 rounded-xl font-medium transition-all whitespace-nowrap border shrink-0 flex items-center gap-2"
              :class="activeJamaahHajiGroupTab === 'Semua' ? 'bg-amber-500/20 text-amber-300 border-amber-500/40 font-bold shadow-md shadow-amber-500/10' : 'bg-slate-900/80 text-slate-400 border-slate-800 hover:bg-slate-800 hover:text-slate-200'">
              <span>Semua Group</span>
              <span class="px-1.5 py-0.2 text-[10px] rounded-full bg-slate-950 border border-slate-700 font-mono"
                x-text="getFilteredViewJamaahHajiList().length"></span>
            </button>

            <template x-for="grp in getGroupedViewJamaahHajiData()" :key="grp.groupName">
              <button @click="activeJamaahHajiGroupTab = grp.groupName"
                class="px-3.5 py-1.5 rounded-xl font-medium transition-all whitespace-nowrap border shrink-0 flex items-center gap-2"
                :class="activeJamaahHajiGroupTab === grp.groupName ? 'bg-amber-500/20 text-amber-300 border-amber-500/40 font-bold shadow-md shadow-amber-500/10' : 'bg-slate-900/80 text-slate-400 border-slate-800 hover:bg-slate-800 hover:text-slate-200'">
                <span x-text="grp.groupName"></span>
                <span class="px-1.5 py-0.2 text-[10px] rounded-full bg-slate-950 border border-slate-700 font-mono"
                  x-text="grp.items.length"></span>
              </button>
            </template>
          </div>
        </template>
      </div>

      <!-- Filter Dropdown Status Haji -->
      <div class="flex items-center gap-2 bg-slate-950/80 border border-slate-800 p-1 rounded-xl text-xs shrink-0">
        <span class="text-slate-400 pl-2 text-[11px] font-medium flex items-center gap-1">
          <i class="fa-solid fa-filter text-cyan-400 text-xs"></i>
          <span class="hidden sm:inline">Status Haji:</span>
        </span>
        <select x-model="viewJamaahHajiFilterStatusHaji"
          class="bg-slate-900 border border-slate-700 text-slate-200 text-xs rounded-lg px-2.5 py-1 focus:outline-none focus:border-cyan-400 font-medium max-w-[150px] sm:max-w-none">
          <option value="Semua">Semua Status</option>
          <template x-for="opt in getUniqueViewJamaahOptions('statusHaji')" :key="opt">
            <option :value="opt" x-text="opt"></option>
          </template>
        </select>
      </div>

    </div>
  </template>

  <!-- LOADING STATE -->
  <div x-show="isViewJamaahHajiLoading"
    class="p-12 text-center bg-slate-900/50 border border-slate-800 rounded-2xl space-y-3">
    <div
      class="w-10 h-10 rounded-xl bg-amber-500/10 border border-amber-500/20 flex items-center justify-center text-amber-400 mx-auto">
      <i class="fa-solid fa-circle-notch animate-spin text-lg"></i>
    </div>
    <p class="text-xs font-semibold text-slate-300">Memuat data Jamaah Haji...</p>
  </div>

  <!-- EMPTY STATE -->
  <div x-show="!isViewJamaahHajiLoading && getFilteredViewJamaahHajiList().length === 0"
    class="p-10 text-center bg-slate-900/50 border border-slate-800 rounded-2xl space-y-3">
    <div
      class="w-12 h-12 rounded-2xl bg-amber-500/10 border border-amber-500/20 flex items-center justify-center text-amber-400 mx-auto">
      <i class="fa-solid fa-kaaba text-xl"></i>
    </div>
    <p class="text-xs font-bold text-slate-200"
      x-text="'Belum Ada Baris Data pada Sheet ' + (viewJamaahHajiMeta ? viewJamaahHajiMeta.sheetName : 'DataJamaahHaji')">
    </p>
    <p class="text-[11px] text-slate-400 max-w-md mx-auto">
      Silakan periksa baris data pada Google Spreadsheet Anda.
    </p>

    <!-- List Sheet yang Terdeteksi -->
    <template
      x-if="viewJamaahHajiMeta && viewJamaahHajiMeta.availableSheets && viewJamaahHajiMeta.availableSheets.length > 0">
      <div class="mt-4 p-3 bg-slate-950/80 border border-slate-800 rounded-xl text-left max-w-md mx-auto">
        <p class="text-[11px] font-bold text-amber-400 mb-1.5 flex items-center gap-1.5">
          <i class="fa-solid fa-table-cells"></i>
          <span>Daftar Sheet yang Terdeteksi di Spreadsheet:</span>
        </p>
        <ul class="text-[10px] text-slate-300 space-y-1 font-mono list-disc list-inside">
          <template x-for="shName in viewJamaahHajiMeta.availableSheets" :key="shName">
            <li x-text="shName"></li>
          </template>
        </ul>
      </div>
    </template>

    <div class="pt-2">
      <button @click="loadViewJamaahHajiData(true)"
        class="px-4 py-2 rounded-xl bg-amber-500/10 hover:bg-amber-500/20 text-amber-400 border border-amber-500/30 text-xs font-medium transition-all inline-flex items-center gap-2">
        <i class="fa-solid fa-rotate" :class="{'fa-spin': isViewJamaahHajiLoading}"></i>
        <span>Refresh Real-Time</span>
      </button>
    </div>
  </div>

  <!-- 3. TAMPILAN MODUL BERDASARKAN GROUP (MODE GROUPING AKTIF) -->
  <template
    x-if="!isViewJamaahHajiLoading && viewJamaahHajiGroupBy !== 'none' && getFilteredViewJamaahHajiList().length > 0">
    <div class="space-y-5">
      <template x-for="grp in getGroupedViewJamaahHajiData()" :key="grp.groupName">
        <!-- Render Group Card jika Tab = 'Semua' atau sama dengan nama Group -->
        <div x-show="activeJamaahHajiGroupTab === 'Semua' || activeJamaahHajiGroupTab === grp.groupName"
          class="bg-slate-900/90 border border-slate-800 rounded-2xl overflow-hidden shadow-xl">
          <!-- Group Header Card -->
          <div class="p-4 bg-slate-950 border-b border-slate-800 flex items-center justify-between gap-3">
            <div class="flex items-center gap-2.5">
              <div
                class="w-7 h-7 rounded-lg bg-amber-500/10 border border-amber-500/20 flex items-center justify-center text-amber-400 text-xs font-bold">
                <i class="fa-solid fa-folder-closed"></i>
              </div>
              <h3 class="text-xs font-extrabold text-slate-100 flex items-center gap-2">
                <span x-text="getGroupLabelName() + ': '"></span>
                <span class="text-amber-300" x-text="grp.groupName"></span>
              </h3>
            </div>

            <div class="flex items-center gap-2">
              <span
                class="px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-amber-500/10 text-amber-400 border border-amber-500/20 font-mono"
                x-text="grp.items.length + ' Jamaah'"></span>
            </div>
          </div>

          <!-- Tabel Jamaah Per Group -->
          <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse text-xs whitespace-nowrap">
              <thead>
                <tr class="bg-slate-950/60 text-slate-400 font-semibold border-b border-slate-800">
                  <th class="py-3 px-4 border-r border-slate-800 text-center w-12">#</th>
                  <th class="py-3 px-4 border-r border-slate-800 text-slate-100 font-bold">NAMA JAMAAH</th>
                  <th class="py-3 px-4 border-r border-slate-800 text-amber-400 font-bold">NO. BPIH</th>
                  <th class="py-3 px-4 border-r border-slate-800 text-emerald-400 font-bold">NO. HP / WA</th>
                  <th class="py-3 px-4 border-r border-slate-800 text-slate-300">GROUP / KATEGORI</th>
                  <th class="py-3 px-4 text-center w-20">AKSI</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-800/60 font-sans">
                <template x-for="(item, idx) in grp.items" :key="item._rowIndex">
                  <tr class="hover:bg-slate-800/40 transition-colors cursor-pointer"
                    @click="openJamaahDetailModal(item)">
                    <td class="py-3 px-4 border-r border-slate-800 text-center text-slate-500 font-mono font-bold"
                      x-text="idx + 1"></td>
                    <td
                      class="py-3 px-4 border-r border-slate-800 font-bold text-slate-100 text-sm flex items-center gap-2 flex-wrap">
                      <span x-text="item.nama"></span>
                      <template x-if="item.statusBpih">
                        <span class="px-2 py-0.5 rounded-full text-[10px] font-bold font-mono"
                          :class="(item.statusBpih === 'F' || String(item.statusBpih).toUpperCase() === 'F') ? 'bg-purple-500/20 text-purple-300 border border-purple-500/30' : 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/30'"
                          x-text="item.statusBpihLabel || ('Status ' + item.statusBpih)"></span>
                      </template>
                      <template x-if="item.lamaAntrian">
                        <span
                          class="px-2 py-0.5 rounded-full text-[10px] font-bold font-mono bg-cyan-500/10 text-cyan-400 border border-cyan-500/20"
                          x-text="'⏳ ' + item.lamaAntrian"></span>
                      </template>
                    </td>
                    <td class="py-3 px-4 border-r border-slate-800 font-mono text-amber-300 font-bold"
                      x-text="item.noBpih"></td>
                    <td class="py-3 px-4 border-r border-slate-800 font-mono text-emerald-300 font-semibold">
                      <span x-text="item.noHp"></span>
                      <template x-if="item.noHp && item.noHp !== '-'">
                        <a :href="'https://wa.me/' + cleanPhoneForWa(item.noHp)" target="_blank" @click.stop
                          class="ml-1.5 text-emerald-400 hover:text-emerald-300 text-xs">
                          <i class="fa-brands fa-whatsapp"></i>
                        </a>
                      </template>
                    </td>
                    <td class="py-3 px-4 border-r border-slate-800 text-slate-300 text-[11px]" x-text="grp.groupName">
                    </td>
                    <td class="py-3 px-4 text-center">
                      <button @click.stop="openJamaahDetailModal(item)"
                        class="px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 text-[10px] font-medium border border-slate-700 transition-all flex items-center justify-center gap-1 mx-auto">
                        <i class="fa-solid fa-eye text-amber-400"></i>
                        <span>Detail</span>
                      </button>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </div>
      </template>
    </div>
  </template>

  <!-- 4. TAMPILAN TANPA GROUPING (DAFTAR TUNGGAL) -->
  <div
    x-show="!isViewJamaahHajiLoading && viewJamaahHajiGroupBy === 'none' && getFilteredViewJamaahHajiList().length > 0"
    class="bg-slate-900/90 border border-slate-800 rounded-2xl overflow-hidden shadow-xl">
    <div class="p-4 bg-slate-950 border-b border-slate-800 flex items-center justify-between">
      <h3 class="text-xs font-bold text-slate-200 flex items-center gap-2">
        <i class="fa-solid fa-list text-amber-400"></i>
        <span>Daftar Seluruh Jamaah Haji</span>
      </h3>
      <span class="text-xs text-slate-400 font-mono"
        x-text="getFilteredViewJamaahHajiList().length + ' Baris Tampil'"></span>
    </div>

    <div class="overflow-x-auto">
      <table class="w-full text-left border-collapse text-xs whitespace-nowrap">
        <thead>
          <tr class="bg-slate-950 text-slate-400 font-semibold border-b border-slate-800">
            <th class="py-3 px-4 border-r border-slate-800 text-center w-12">#</th>
            <th class="py-3 px-4 border-r border-slate-800 text-slate-100 font-bold">NAMA JAMAAH</th>
            <th class="py-3 px-4 border-r border-slate-800 text-amber-400 font-bold">NO. BPIH</th>
            <th class="py-3 px-4 border-r border-slate-800 text-emerald-400 font-bold">NO. HP / WA</th>
            <th class="py-3 px-4 border-r border-slate-800 text-purple-400 font-bold">STATUS BPIH</th>
            <th class="py-3 px-4 border-r border-slate-800 text-cyan-400 font-bold">JENIS HAJI</th>
            <th class="py-3 px-4 text-center w-20">AKSI</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-slate-800/60 font-sans">
          <template x-for="(item, idx) in getFilteredViewJamaahHajiList()" :key="item._rowIndex">
            <tr class="hover:bg-slate-800/40 transition-colors cursor-pointer" @click="openJamaahDetailModal(item)">
              <td class="py-3 px-4 border-r border-slate-800 text-center text-slate-500 font-mono font-bold"
                x-text="idx + 1"></td>
              <td
                class="py-3 px-4 border-r border-slate-800 font-bold text-slate-100 text-sm flex items-center gap-2 flex-wrap">
                <span x-text="item.nama"></span>
                <template x-if="item.lamaAntrian">
                  <span
                    class="px-2 py-0.5 rounded-full text-[10px] font-bold font-mono bg-cyan-500/10 text-cyan-400 border border-cyan-500/20"
                    x-text="'⏳ ' + item.lamaAntrian"></span>
                </template>
              </td>
              <td class="py-3 px-4 border-r border-slate-800 font-mono text-amber-300 font-bold" x-text="item.noBpih">
              </td>
              <td class="py-3 px-4 border-r border-slate-800 font-mono text-emerald-300 font-semibold">
                <span x-text="item.noHp"></span>
                <template x-if="item.noHp && item.noHp !== '-'">
                  <a :href="'https://wa.me/' + cleanPhoneForWa(item.noHp)" target="_blank" @click.stop
                    class="ml-1.5 text-emerald-400 hover:text-emerald-300 text-xs">
                    <i class="fa-brands fa-whatsapp"></i>
                  </a>
                </template>
              </td>
              <td class="py-3 px-4 border-r border-slate-800 font-medium">
                <span class="px-2 py-0.5 rounded-full text-[10px] font-bold font-mono"
                  :class="(item.statusBpih === 'F' || String(item.statusBpih).toUpperCase() === 'F') ? 'bg-purple-500/20 text-purple-300 border border-purple-500/30' : 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/30'"
                  x-text="item.statusBpihLabel || ('Status ' + item.statusBpih)"></span>
              </td>
              <td class="py-3 px-4 border-r border-slate-800 font-medium">
                <span class="px-2 py-0.5 rounded text-[10px] font-semibold"
                  :class="getJenisHajiBadgeStyle(item.jenisHaji)" x-text="item.jenisHaji || 'Setoran Awal'"></span>
              </td>
              <td class="py-3 px-4 text-center">
                <button @click.stop="openJamaahDetailModal(item)"
                  class="px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 text-[10px] font-medium border border-slate-700 transition-all flex items-center justify-center gap-1 mx-auto">
                  <i class="fa-solid fa-eye text-amber-400"></i>
                  <span>Detail</span>
                </button>
              </td>
            </tr>
          </template>
        </tbody>
      </table>
    </div>
  </div>

  <!-- 5. MODAL DETAIL JAMAAH HAJI -->
  <div x-show="showJamaahHajiDetailModal"
    class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm" x-transition
    x-cloak>
    <div @click.away="showJamaahHajiDetailModal = false"
      class="bg-slate-900 border border-slate-800 w-full max-w-2xl rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
      <!-- Modal Header -->
      <div class="p-4 sm:p-5 bg-slate-950 border-b border-slate-800 flex items-center justify-between shrink-0">
        <div class="flex items-center gap-3">
          <div
            class="w-10 h-10 rounded-xl bg-amber-500/20 border border-amber-500/30 flex items-center justify-center text-amber-400 shrink-0">
            <i class="fa-solid fa-user-gear text-base"></i>
          </div>
          <div>
            <h3 class="text-sm font-extrabold text-slate-100"
              x-text="selectedJamaahHajiDetail ? selectedJamaahHajiDetail.nama : 'Detail Jamaah Haji'"></h3>
            <p class="text-[11px] text-amber-400 font-mono"
              x-text="'NO BPIH: ' + (selectedJamaahHajiDetail ? selectedJamaahHajiDetail.noBpih : '-')"></p>
          </div>
        </div>
        <button @click="showJamaahHajiDetailModal = false"
          class="w-8 h-8 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-slate-200 flex items-center justify-center transition-all">
          <i class="fa-solid fa-xmark text-sm"></i>
        </button>
      </div>

      <!-- Modal Content Body -->
      <div class="p-5 overflow-y-auto space-y-4 text-xs font-sans">
        <template x-if="selectedJamaahHajiDetail">
          <div class="space-y-4">
            <!-- Grid Atribut Utama -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 p-3.5 bg-slate-950/60 border border-slate-800 rounded-xl">
              <div>
                <span class="text-[10px] text-slate-500 font-semibold block uppercase tracking-wider">Nama Jamaah</span>
                <span class="text-xs font-bold text-slate-100" x-text="selectedJamaahHajiDetail.nama"></span>
              </div>
              <div>
                <span class="text-[10px] text-slate-500 font-semibold block uppercase tracking-wider">No. BPIH</span>
                <span class="text-xs font-mono font-bold text-amber-400"
                  x-text="selectedJamaahHajiDetail.noBpih"></span>
              </div>
              <div>
                <span class="text-[10px] text-slate-500 font-semibold block uppercase tracking-wider">No. Telepon /
                  WA</span>
                <span class="text-xs font-mono font-semibold text-emerald-400"
                  x-text="selectedJamaahHajiDetail.noHp"></span>
              </div>
              <div>
                <span class="text-[10px] text-slate-500 font-semibold block uppercase tracking-wider">Jenis Haji /
                  Kategori</span>
                <span class="text-xs font-semibold text-cyan-400"
                  x-text="selectedJamaahHajiDetail.jenisHaji || 'Setoran Awal'"></span>
              </div>
            </div>

            <!-- Rincian Seluruh Atribut Kolom Sheet -->
            <div class="space-y-2">
