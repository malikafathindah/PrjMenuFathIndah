<div x-show="currentModule === 'mod_modules'" class="space-y-6" x-transition>
  <!-- Header Bar -->
  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 bg-slate-900/80 border border-slate-800 rounded-2xl p-5 shadow-md">
    <div>
      <h2 class="text-xl font-bold text-slate-100 flex items-center gap-2">
        <i class="fa-solid fa-sliders text-cyan-400"></i>
        <span>Registry & Modul Manager</span>
      </h2>
      <p class="text-xs text-slate-400 mt-1">Kelola modul terdaftar, atur hak akses role, dan aktifkan/nonaktifkan modul secara dinamis</p>
    </div>
    <div class="flex items-center gap-3">
      <button @click="openModuleModal()" class="px-4 py-2.5 bg-gradient-to-r from-blue-600 to-cyan-500 hover:from-blue-500 hover:to-cyan-400 text-white rounded-xl text-xs font-semibold shadow-lg shadow-cyan-500/20 transition-all flex items-center gap-2">
        <i class="fa-solid fa-plus text-xs"></i>
        <span>Daftarkan Modul Baru</span>
      </button>
    </div>
  </div>

  <!-- Modules Grid Cards -->
  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
    <template x-for="mod in modulesList" :key="mod.ModuleID">
      <div class="bg-slate-900/80 border border-slate-800 hover:border-slate-700 rounded-2xl p-5 shadow-md flex flex-col justify-between transition-all">
        <div>
          <div class="flex items-start justify-between gap-3 mb-3">
            <div class="w-10 h-10 rounded-xl bg-blue-500/10 border border-blue-500/20 text-cyan-400 flex items-center justify-center shrink-0">
              <i :class="mod.Icon || 'fa-solid fa-cube'" class="text-lg"></i>
            </div>
            <span class="px-2.5 py-1 rounded-full text-[10px] font-semibold uppercase tracking-wider"
              :class="mod.Status === 'Active' ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : 'bg-slate-800 text-slate-500 border border-slate-700'"
              x-text="mod.Status"></span>
          </div>

          <h3 class="text-base font-bold text-slate-100" x-text="mod.ModuleName"></h3>
          <p class="text-xs text-slate-400 mt-1 line-clamp-2" x-text="mod.Description || 'Modul internal perusahaan'"></p>

          <div class="mt-4 pt-3 border-t border-slate-800/80 space-y-2 text-xs">
            <div class="flex justify-between text-slate-400">
              <span>ID Modul:</span>
              <span class="font-mono text-cyan-400" x-text="mod.ModuleID"></span>
            </div>
            <div class="flex justify-between text-slate-400">
              <span>Kategori:</span>
              <span class="text-slate-200" x-text="mod.Category"></span>
            </div>
            <div class="flex justify-between text-slate-400">
              <span>Akses Role:</span>
              <span class="text-slate-300 font-medium" x-text="mod.AccessRole"></span>
            </div>
          </div>
        </div>

        <div class="mt-5 pt-3 border-t border-slate-800/80 flex items-center justify-between">
          <span class="text-[11px] text-slate-500">Urutan: #<span x-text="mod.Order"></span></span>
          <button @click="toggleModule(mod.ModuleID, mod.Status === 'Active' ? 'Inactive' : 'Active')"
            class="px-3 py-1.5 rounded-lg text-xs font-semibold transition-colors"
            :class="mod.Status === 'Active' ? 'bg-rose-500/10 text-rose-400 border border-rose-500/20 hover:bg-rose-500/20' : 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 hover:bg-emerald-500/20'">
            <span x-text="mod.Status === 'Active' ? 'Nonaktifkan' : 'Aktifkan'"></span>
          </button>
        </div>
      </div>
    </template>
  </div>

  <!-- Register Module Modal -->
  <div x-show="moduleModalOpen" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm" x-cloak>
    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl space-y-5" @click.away="moduleModalOpen = false">
      <div class="flex items-center justify-between border-b border-slate-800 pb-4">
        <h3 class="text-base font-bold text-slate-100">Registrasi Modul Baru</h3>
        <button @click="moduleModalOpen = false" class="text-slate-500 hover:text-slate-300">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>

      <form @submit.prevent="saveModule()" class="space-y-4 text-xs">
        <div>
          <label class="block text-slate-400 font-semibold mb-1">ID Modul (Unique)</label>
          <input type="text" x-model="moduleForm.ModuleID" required placeholder="misal: mod_hris"
            class="w-full px-3 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-slate-200 placeholder-slate-600 focus:outline-none focus:border-cyan-400 font-mono">
        </div>

        <div>
          <label class="block text-slate-400 font-semibold mb-1">Nama Modul</label>
          <input type="text" x-model="moduleForm.ModuleName" required placeholder="misal: Manajemen HRIS & Payroll"
            class="w-full px-3 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-slate-200 placeholder-slate-600 focus:outline-none focus:border-cyan-400">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-slate-400 font-semibold mb-1">Kategori</label>
            <input type="text" x-model="moduleForm.Category" placeholder="Operasional"
              class="w-full px-3 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-slate-200 focus:outline-none focus:border-cyan-400">
          </div>
          <div>
            <label class="block text-slate-400 font-semibold mb-1">Icon FontAwesome</label>
            <input type="text" x-model="moduleForm.Icon" placeholder="fa-solid fa-user-tag"
              class="w-full px-3 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-slate-200 focus:outline-none focus:border-cyan-400">
          </div>
        </div>

        <div>
          <label class="block text-slate-400 font-semibold mb-1">Akses Role (pisahkan dengan koma)</label>
          <input type="text" x-model="moduleForm.AccessRole" placeholder="Admin,Manager,Staff"
            class="w-full px-3 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-slate-200 focus:outline-none focus:border-cyan-400">
        </div>

        <div>
          <label class="block text-slate-400 font-semibold mb-1">Deskripsi Singkat</label>
          <textarea x-model="moduleForm.Description" rows="2" placeholder="Fungsi dan kegunaan modul ini..."
            class="w-full px-3 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-slate-200 focus:outline-none focus:border-cyan-400"></textarea>
        </div>

        <div class="pt-4 border-t border-slate-800 flex justify-end gap-2">
          <button type="button" @click="moduleModalOpen = false" class="px-4 py-2 bg-slate-800 text-slate-300 rounded-xl hover:bg-slate-700 transition-colors">Batal</button>
          <button type="submit" class="px-4 py-2 bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold rounded-xl transition-colors">Daftarkan Modul</button>
        </div>
      </form>
    </div>
  </div>
</div>
